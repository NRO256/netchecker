name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Package release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path NetChecker -Force | Out-Null
          Copy-Item target/release/NetChecker.exe NetChecker/
          Copy-Item README.txt NetChecker/
          Copy-Item LICENSE NetChecker/
          Compress-Archive -Path NetChecker -DestinationPath "NetChecker-${{ github.ref_name }}-windows-x86_64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: NetChecker-${{ github.ref_name }}-windows-x86_64.zip
          generate_release_notes: true
