[package]
name = "netchecker"
version = "0.5.1"
authors = ["NRO / Antigravity"]
edition = "2024"
description = "NetChecker Portable - Lightweight Network Diagnostics CLI for Windows 10/11"
license = "MIT"
readme = "README.md"
repository = "https://github.com/NRO256/netchecker"
keywords = ["network", "diagnostics", "windows", "cli", "ping"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "NetChecker"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
